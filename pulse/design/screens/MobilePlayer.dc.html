<helmet>

<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #111217; color: #F7F4EF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 8px; padding: 52px 8px 10px">
    <a href="MobileHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: #F7F4EF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northern Lights Timelapse</h1>

  <div style="position: relative; height: 220px; background: radial-gradient(80% 70% at 30% 25%, rgba(59, 201, 160, 0.6) 0%, rgba(59, 201, 160, 0) 60%), radial-gradient(60% 60% at 78% 18%, rgba(110, 91, 216, 0.55) 0%, rgba(110, 91, 216, 0) 62%), radial-gradient(120% 70% at 50% 120%, #1B2433 0%, #0A0F18 55%), #05070C">

      <button aria-label="Pause" style="width: 72px; height: 72px; border: 0; border-radius: 36px; background: #FF6A28; color: #111217; display: grid; place-items: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.2"></rect><rect x="14" y="4.5" width="4" height="15" rx="1.2"></rect></svg></button>

  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="768" aria-valuenow="476" tabindex="0" style="position: relative; height: 24px; display: flex; align-items: center">

    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #AAAAB3; font-variant-numeric: tabular-nums"><span>7:56</span><span>−4:52</span></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 14px 8px 0">
    <a href="MobileTools.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; color: #F7F4EF; text-decoration: none; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M7 12h4M13 12h4M7 15.5h7"></path></svg>Subtitles</a>
    <a href="MobileTools.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; color: #F7F4EF; text-decoration: none; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"></path></svg>Audio</a>
    <a href="MobileTools.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; color: #F7F4EF; text-decoration: none; font-size: 12px; font-weight: 500"><span style="height: 24px; display: grid; place-items: center"><span style="padding: 1px 6px; border-radius: 6px; border: 1.75px solid currentColor; font-size: 11px; font-weight: 700">1.0×</span></span>Speed</a>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; border: 0; background: transparent; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor" stroke="none"></rect></svg>PiP</button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; border: 0; background: transparent; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"></path></svg>Landscape</button>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 28px; padding: 14px 0 6px">
    <button aria-label="Previous" style="width: 52px; height: 52px; border: 0; border-radius: 26px; background: #1F2430; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 5v14l-10-7z" fill="currentColor"></path><path d="M6 5v14"></path></svg></button>
    <button aria-label="Next" style="width: 52px; height: 52px; border: 0; border-radius: 26px; background: #1F2430; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 5v14l10-7z" fill="currentColor"></path><path d="M18 5v14"></path></svg></button>
  </div>

  <a href="MobileQueue.dc.html" style="margin: auto 12px 30px; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 14px; border-radius: 18px; background: #1F2430; border: 1px solid #393944; color: #F7F4EF; text-decoration: none">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #393944"></span>
    <span style="display: flex; align-items: center"><span style="flex: 1; font-size: 15px; font-weight: 700">Up next</span><span style="font-size: 13px; color: #FF8A4C; font-weight: 600">8 items</span></span>
    <span style="display: flex; align-items: center; gap: 12px">
      <span style="width: 72px; height: 40px; border-radius: 8px; background: radial-gradient(90% 80% at 30% 25%, #FFD166 0%, rgba(0,0,0,0) 55%), linear-gradient(170deg, #2A2E39, #0B0D12)"></span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 600">Family Trip – Lisbon 2025.mov</span><span style="display: block; font-size: 12px; color: #AAAAB3">18:32</span></span>
    </span>
  </a>
</div>
