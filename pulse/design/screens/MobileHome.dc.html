<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse — Home on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111217}
a{color:#FF8A4C}a:hover{color:#FFD166}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #FFD166;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #111217; color: #F7F4EF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 10px; padding: 52px 16px 8px">
    <svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true"><path d="M4 4.6c0-1.2 1.3-1.9 2.3-1.3l10.6 7.4c.9.6.9 1.9 0 2.6L6.3 20.7c-1 .6-2.3-.1-2.3-1.3z" fill="#FF6A28"></path><path d="M19.5 4.5l7 7.5-7 7.5" fill="none" stroke="#FFD166" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="flex: 1; font-size: 15px; font-weight: 700; letter-spacing: 0.32em">PULSE</span>
    <button aria-label="Search" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1F2430; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 20px; background: radial-gradient(420px 240px at 100% 0%, rgba(255, 106, 40, 0.16), rgba(17, 18, 23, 0) 70%)">
    <div>
      <h1 style="margin: 0; font-size: 30px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em">Play anything <span style="color: #FF6A28">instantly.</span></h1>
      <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: #AAAAB3">Open a file, a folder or a stream. No library needed.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <a href="MobilePlayer.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 14px; background: #FF6A28; color: #111217; text-decoration: none; font-size: 16px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>Open file</a>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 14px; border: 1px solid #393944; background: #1F2430; font-size: 14px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6A28" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Folder</button>
        <button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 14px; border: 1px solid #393944; background: #1F2430; font-size: 14px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6A28" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>URL</button>
      </div>
    </div>
    <section aria-labelledby="mr" style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; margin-bottom: 4px"><h2 id="mr" style="margin: 0; font-size: 18px; font-weight: 700; flex: 1">Recent</h2><button style="height: 36px; padding: 0 8px; border: 0; background: transparent; color: #AAAAB3; font-size: 13px; font-weight: 600">Clear</button></div>
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
        <a href="MobilePlayer.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px 0; color: #F7F4EF; text-decoration: none">
          <span style="{{r.thumb}}"><span style="{{r.bar}}"></span></span>
          <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="display: block; font-size: 13px; color: #AAAAB3">{{r.meta}}</span></span>
        </a>
      </sc-for>
    </section>
  </main>

  <div aria-label="Mini player" style="margin: 0 10px 8px; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 10px; border-radius: 14px; background: #2A2E39">
    <span style="width: 40px; height: 40px; border-radius: 8px; background: radial-gradient(circle at 60% 40%, #FF6A28 0%, #B8301A 30%, #2A0E18 70%)"></span>
    <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 600">Midnight Drive</span><span style="display: block; font-size: 12px; color: #AAAAB3">Neon District</span></span>
    <button aria-label="Pause" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #FF6A28; color: #111217; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.2"></rect><rect x="14" y="4.5" width="4" height="15" rx="1.2"></rect></svg></button>
  </div>

  <nav aria-label="Primary" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 26px; border-top: 1px solid #393944; background: #111217">
    <a href="MobileHome.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #FF6A28; text-decoration: none; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Library.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #AAAAB3; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="18" rx="1.5"></rect><rect x="11" y="3" width="4" height="18" rx="1"></rect><path d="m17.5 4 3.5 16"></path></svg>Library</a>
    <a href="MobileQueue.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #AAAAB3; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h13M3 11h13M3 16h8"></path><path d="M16 14v6l5-3z" fill="currentColor"></path></svg>Playlists</a>
    <a href="Network.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #AAAAB3; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M2 9.5a14 14 0 0 1 20 0M5 12.8a9.5 9.5 0 0 1 14 0M8.2 16a5 5 0 0 1 7.6 0"></path><circle cx="12" cy="19.3" r="1.2" fill="currentColor"></circle></svg>Network</a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #AAAAB3; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = (bg) => 'position: relative; flex: 0 0 auto; width: 96px; height: 54px; border-radius: 10px; overflow: hidden; background: ' + bg;
    const b = (pct) => 'position: absolute; left: 0; bottom: 0; height: 3px; background: #FF6A28; width: ' + pct + '%';
    const recent = [
      ['Northern Lights Timelapse.mp4', 'Resume at 7:56 · 2 h ago', 'radial-gradient(90% 80% at 30% 20%, #3BC9A0 0%, rgba(0,0,0,0) 55%), linear-gradient(170deg, #142238, #070A10)', 62],
      ['Midnight Drive.flac', 'FLAC · 4:51 · 5 h ago', 'radial-gradient(circle at 60% 40%, #FF6A28 0%, #B8301A 30%, #2A0E18 70%)', 0],
      ['Lecture 07 – Signals and Systems.mkv', 'Resume at 23:04 · Yesterday', 'linear-gradient(135deg, #2A2E39, #1F2430)', 28],
      ['Harbor camera', 'RTSP stream · 2 days ago', 'linear-gradient(160deg, #23324A, #0D1220)', 0]
    ];
    return { recent: recent.map(([title, meta, bg, pct]) => ({ title: title, meta: meta, thumb: t(bg), bar: b(pct) })) };
  }
}
</script>
</body>
</html>
